{% extends "mercado/base.html" %}
{% block content %}

<h2>Tu carrito</h2>
<table class="table">
    <thead>
        <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Acción</th> 
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.producto.nombre }}</td>
            <td>{{ item.cantidad }}</td>
            <td>${{ item.producto.precio }}</td>
            <td>
                <a href="{% url 'eliminar_del_carrito' item.producto.id %}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<p><strong>Total:</strong> ${{ total }}</p>

<!-- En el carrito.html, después de mostrar el total -->
<div class="card-footer">
    <div class="d-flex justify-content-between align-items-center">
        <h4 class="mb-0">Total: ${{ total }}</h4>
        <div class="d-flex gap-2">
            <a href="{% url 'pago' %}" class="btn btn-success btn-lg">
                💳 Pago
            </a>
        </div>
    </div>
</div>

{% endblock %}
